server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri /index.html;
    }
}

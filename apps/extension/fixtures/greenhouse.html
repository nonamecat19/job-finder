<form id="application_form">
  <div class="field">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" />
  </div>
  <div class="field">
    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" />
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" />
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />
  </div>
  <div class="field">
    <label for="job_city">Location</label>
    <input id="job_city" name="job_city" type="text" />
  </div>
  <div class="field">
    <label for="headline">Headline</label>
    <input id="headline" name="headline" type="text" />
  </div>
  <div class="field">
    <label for="skills">Skills</label>
    <textarea id="skills" name="skills"></textarea>
  </div>
  <div class="field">
    <label for="linkedin_profile_url">LinkedIn Profile URL</label>
    <input id="linkedin_profile_url" name="linkedin_profile_url" type="url" />
  </div>
  <div class="field">
    <label for="how_did_you_hear">How did you hear about this job?</label>
    <select id="how_did_you_hear" name="how_did_you_hear">
      <option>LinkedIn</option>
      <option>Indeed</option>
      <option>Company Website</option>
      <option>Referral</option>
      <option>Other</option>
    </select>
  </div>
</form>

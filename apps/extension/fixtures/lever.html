<form>
  <div class="application-field">
    <label for="lever-name">Name</label>
    <input id="lever-name" name="name" type="text" />
  </div>
  <div class="application-field">
    <label for="lever-email">Email</label>
    <input id="lever-email" name="email" type="email" autocomplete="email" />
  </div>
  <div class="application-field">
    <label for="lever-phone">Phone</label>
    <input id="lever-phone" name="phone" type="tel" />
  </div>
  <div class="application-field">
    <label for="lever-org">Current Company</label>
    <input id="lever-org" name="org" type="text" />
  </div>
  <div class="application-field">
    <label for="lever-headline">Headline</label>
    <input id="lever-headline" name="headline" type="text" />
  </div>
  <div class="application-field">
    <label for="lever-skills">Skills</label>
    <textarea id="lever-skills" name="skills"></textarea>
  </div>
  <div class="application-field">
    <label for="lever-linkedin">LinkedIn Profile URL</label>
    <input id="lever-linkedin" name="urls[LinkedIn]" type="url" />
  </div>
  <div class="application-field">
    <label for="lever-source">How did you hear about us?</label>
    <select id="lever-source" name="source">
      <option>LinkedIn</option>
      <option>Google</option>
      <option>Referral</option>
    </select>
  </div>
</form>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Finder Autofill</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <span class="popup-title">Job Finder Autofill</span>
        <span id="status-chip" class="chip chip-unknown">checking…</span>
      </header>

      <section id="connect-section" hidden>
        <p class="hint">
          Open the dashboard's Settings page, generate a pairing code, and paste it below.
        </p>
        <div class="row">
          <input id="code-input" type="text" inputmode="text" placeholder="Pairing code" autocomplete="off" />
          <button id="connect-btn" type="button">Connect</button>
        </div>
        <p id="connect-error" class="error" hidden></p>
        <a id="open-dashboard" class="link" href="http://localhost:5173/settings" target="_blank" rel="noreferrer">
          Open dashboard settings →
        </a>
      </section>

      <section id="connected-section" hidden>
        <div id="profile-summary" class="profile-summary"></div>
        <div class="row">
          <button id="fill-btn" type="button" class="primary">Fill this page</button>
        </div>
        <button id="disconnect-btn" type="button" class="link-btn">Disconnect</button>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>

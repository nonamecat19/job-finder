<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: Georgia, 'Times New Roman', serif; font-size: 11pt; color: #1a1a1a; line-height: 1.6; max-width: 640px; }
  .sender { font-weight: 600; margin-bottom: 4px; }
  .re { color: #555; margin-bottom: 24px; }
  p { margin-bottom: 14px; }
</style>
</head>
<body>
  {{if .Name}}<div class="sender">{{.Name}}</div>{{end}}
  <div class="re">Re: {{.Title}} — {{.Company}}</div>
  {{range .Paragraphs}}
  <p>{{.}}</p>
  {{end}}
</body>
</html>

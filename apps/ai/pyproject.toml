[project]
name = "jobfinder-ai"
version = "0.1.0"
description = "AI orchestration service for job-finder — LangChain/LangGraph capabilities over the LiteLLM gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain==1.3.15",
    "langgraph==1.2.11",
    "langchain-openai==1.5.1",
    "langfuse==4.14.4",
    "fastapi==0.141.1",
    "faststream[rabbit]==0.7.4",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pip-audit==2.10.1",
    "datamodel-code-generator==0.74.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder_ai"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["jobfinder_ai"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
pythonpath = ["src"]

name: API CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Which parts of the tree a pull request touched. Every other job gates on
  # this so a specs-only or docs-only change does not spend ~20 runner-minutes
  # rebuilding Go and Node.
  #
  # Deliberately NOT a top-level `on: paths:` filter: a workflow skipped that
  # way never reports its checks at all, so once the Phase 2 ruleset in
  # specs/domains/platform-operations.md � 2.2 is applied
  # every required check would sit at "Expected" forever and block the merge.
  # A job skipped by `if:` reports as skipped, which GitHub counts as passing.
  #
  # Outputs fold in the event check, so pushes to master (and manual re-runs)
  # always run the full set: dorny/paths-filter diffs against the previous
  # commit on push, which is a weaker signal than a PR's merge-base.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      sqlc: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sqlc == 'true' }}
      tygo: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tygo == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      any: ${{ github.event_name != 'pull_request' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Each filter lists only what can actually change its own verdict.
            #
            # Documentation and repo-workflow paths deliberately appear in NO
            # filter, so a change confined to them skips every job:
            #   specs/**, docs/**, .specify/**, scripts/hooks/**,
            #   AGENTS.md, README.md, Makefile, .github/workflows/**
            #
            # Makefile and the workflow files used to force the whole set on the
            # grounds that they can change any verdict. True, but it meant a
            # docs-only pull request that adjusted a Makefile comment spent ~20
            # runner-minutes rebuilding Go and Node. They are covered instead by
            # `on: push: branches: [master]`, which ignores these filters
            # entirely (see the outputs above) and runs the full set on the
            # merge commit — so a Makefile or workflow edit is still exercised,
            # one merge later rather than one pull request earlier.
            go: &go
              - 'apps/api/**'
              - 'scripts/sqlc-check.sh'
              - 'scripts/tygo-check.sh'
              # gateway/** is here because apps/api/internal/platform/llm/
              # gateway_config_test.go reads gateway/config.yaml and asserts the
              # routing contract against it: that every chain terminates at the
              # local tier (035), that no literal credential appears, that the
              # observability callbacks are global (036), and that every tier of
              # a tool-using chain declares its tool capability (037).
              #
              # Without this line a pull request touching ONLY gateway/config.yaml
              # skips the go-test job entirely — so the change that most needs
              # those guardrails is the one change that never runs them.
              - 'gateway/**'
            sqlc:
              - 'scripts/sqlc-check.sh'
              - 'apps/api/sqlc.yaml'
              - 'apps/api/.sqlc-version'
              - 'apps/api/internal/db/migrations/**'
              - 'apps/api/internal/db/queries/**'
              - 'apps/api/internal/db/sqlcgen/**'
            # tygo reads Go DTOs and writes packages/shared/src/generated.ts,
            # so it straddles both sides and watches both.
            tygo:
              - *go
              - 'packages/shared/src/generated.ts'
              - 'scripts/compare-shared-types.py'
            web:
              - 'apps/dashboard/**'
              - 'apps/extension/**'
              - 'packages/shared/**'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            python:
              - 'apps/ai/**'
            # The one deliberately tree-wide filter, in a file whose entire
            # design is about narrowing. `secret scan` is the only gate whose
            # verdict ANY file can change: a provider key pasted into a specs/
            # markdown file is still a provider key, and unlike a broken build
            # it cannot be undone by a follow-up commit — every clone and fork
            # keeps a copy, so the only remedy is rotation.
            #
            # The cost argument that motivated this whole mechanism (~20
            # runner-minutes to rebuild Go and Node) does not apply: the scan
            # is a ~20-second job. It stays inside the filter mechanism rather
            # than dropping its `if:` so it reports uniformly with every other
            # check, and so `any` is available to a future gate with the same
            # semantics.
            any:
              - '**'

  sqlc-drift:
    name: sqlc generate is up to date
    needs: changes
    if: needs.changes.outputs.sqlc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned sqlc version
        id: sqlc
        run: echo "version=$(tr -d '[:space:]' < apps/api/.sqlc-version)" >> "$GITHUB_OUTPUT"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      - name: Check generated code matches migrations and queries
        run: ./scripts/sqlc-check.sh

  tygo-drift:
    name: tygo generate is up to date
    needs: changes
    if: needs.changes.outputs.tygo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned tygo version
        id: tygo
        run: echo "version=$(tr -d '[:space:]' < apps/api/.tygo-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v${{ steps.tygo.outputs.version }}

      - name: Check generated TypeScript matches Go DTOs
        run: ./scripts/tygo-check.sh

  shared-types-no-duplicates:
    name: shared types — no duplicates / no weakened fields / complete nullability
    needs: changes
    if: needs.changes.outputs.tygo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check no duplicated shapes between index.ts and generated.ts
        run: python3 scripts/compare-shared-types.py --check-duplicates

      - name: Check no weakened fields
        run: python3 scripts/compare-shared-types.py --check-strictness

      - name: Check nullability list stays complete
        run: python3 scripts/compare-shared-types.py --check-go-nullability

  lint-go:
    name: lint (go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: Read pinned golangci-lint version
        id: gl
        run: echo "version=$(tr -d '[:space:]' < apps/api/.golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ steps.gl.outputs.version }}
          working-directory: apps/api

  go-vet:
    name: go vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: go vet ./...
        working-directory: apps/api
        run: go vet ./...

  go-test:
    name: go test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: go test ./...
        working-directory: apps/api
        run: go test ./...

  integration-test:
    name: integration test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # No `services:` block: the suite starts every backing service it needs
    # (pgvector Postgres, RabbitMQ, ClickHouse, MinIO, Redis, Chrome,
    # FlareSolverr, LiteLLM) itself, as testcontainers
    # containers owned by the test binary (apps/api/internal/testinfra). That
    # keeps the workflow and a developer's laptop running the exact same
    # infrastructure, and means a service the workflow forgot to declare fails
    # the run rather than being skipped over.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      # This step builds the apps/ai image (internal/aicontract runs the real
      # AI service against the real broker), so a cold runner pays ~4 minutes
      # for that build before any of it runs. Cached rebuilds are seconds; if
      # the wall-clock ever matters more than the coverage, split that one
      # package into its own job rather than deleting the test.
      #
      # One invocation, packages in parallel: each suite creates its own
      # database from a migrated template (internal/dbtest) inside its own
      # package's Postgres container, so no suite depends on another having
      # migrated or truncated a shared one.
      - name: go test -tags integration ./...
        working-directory: apps/api
        run: go test -tags integration ./...

  frontend-test:
    name: frontend test (vitest)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Run dashboard tests
        run: pnpm --filter @job-finder/dashboard test

      # A step rather than a job on purpose: it reuses the shared-package build
      # above, and adding a job would need a branch-protection update.
      - name: Run extension tests
        run: pnpm --filter @job-finder/extension test

  frontend-typecheck:
    name: frontend typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Typecheck
        run: pnpm typecheck

  lint-web:
    name: lint (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: make lint-web
        run: make lint-web

  lint-py:
    name: lint (python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: apps/ai

      - name: make lint-py
        run: make lint-py

  test-py:
    name: test (python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: apps/ai

      - name: make test-py
        run: make test-py

  # ---------------------------------------------------------------------------
  # Supply-chain and build-integrity gates (039)
  #
  # Four classes of defect used to merge green: a leaked credential, a
  # published advisory against a dependency, dependency drift, and a container
  # image that no longer builds. The jobs below close the first three; the
  # fourth is closed by the two image builds at the end.
  #
  # Every one of them is gated by an `if:` on a `changes` output rather than a
  # top-level path filter, for the same reason the rest of this file is: a job
  # skipped by `if:` reports as skipped (which GitHub counts as passing), while
  # a workflow skipped by `on: paths:` reports nothing at all and would leave a
  # required check sitting at "Expected" forever.
  # ---------------------------------------------------------------------------

  secret-scan:
    name: secret scan
    needs: changes
    # Filter `any` — this is the one gate whose verdict any file can change. A
    # provider key pasted into a specs/ markdown file is still a provider key,
    # and unlike a broken build it cannot be undone by a follow-up commit.
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the scan runs over this pull request's own commit
      # range, which needs the merge base present locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned gitleaks version
        id: gl
        run: echo "version=$(tr -d '[:space:]' < .gitleaks-version)" >> "$GITHUB_OUTPUT"

      # The pinned upstream binary, not gitleaks/gitleaks-action: that action
      # requires a GITLEAKS_LICENSE secret for organization-owned repositories.
      # Same scanner, no account, no licence question.
      - name: Install gitleaks
        env:
          VERSION: ${{ steps.gl.outputs.version }}
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scoped to the commits this pull request actually adds (FR-013), so a
      # finding that predates the scanner does not fail unrelated work. On a
      # push, the range is the previous commit to this one — the same weaker
      # signal dorny/paths-filter already degrades to on push.
      #
      # --redact is mandatory (FR-015): without it the workflow log becomes a
      # second copy of the leak, readable by anyone who can read the run.
      - name: Scan the pull request's commit range
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          set +e
          gitleaks git . \
            --redact --no-banner \
            --config .gitleaks.toml \
            --log-opts "$RANGE"
          status=$?
          set -e
          case "$status" in
            0) echo "No secrets found in $RANGE." ;;
            1) echo "::error::Secret detected in this change. Rotate the credential first, then remove it — see specs/domains/platform-operations.md." ; exit 1 ;;
            *) echo "::error::gitleaks failed to run (exit $status). This is a configuration or download problem, NOT a leak." ; exit "$status" ;;
          esac

  vulnerability-scan-go:
    name: vulnerability scan (go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: Read pinned govulncheck version
        id: gv
        run: echo "version=$(tr -d '[:space:]' < apps/api/.govulncheck-version)" >> "$GITHUB_OUTPUT"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ steps.gv.outputs.version }}

      # The wrapper, not govulncheck directly: govulncheck has no ignore file,
      # and an advisory with no upstream fix still needs a reviewable, expiring
      # exception rather than a blanket `|| true`. The script also gives
      # `make vuln-go` the identical verdict locally.
      - name: scripts/govulncheck-check.sh
        run: ./scripts/govulncheck-check.sh

  vulnerability-scan-web:
    name: vulnerability scan (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Frozen, so the audit reads the versions the lockfile actually resolves
      # rather than whatever the registry serves this minute (FR-010).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Severity floor is `high`, declared here rather than left to a tool
      # default. --prod=false keeps devDependencies in scope: the build
      # toolchain is part of the supply chain. Exceptions go in
      # pnpm.auditConfig.ignoreCves with a reason recorded in the domain doc.
      - name: pnpm audit
        run: pnpm audit --audit-level=high --prod=false

  vulnerability-scan-python:
    name: vulnerability scan (python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: apps/ai

      - name: make vuln-py
        run: make vuln-py

  # C7-3/FR-011: the AI service reaches every model through the LiteLLM
  # gateway's OpenAI-compatible endpoint, never a provider SDK directly.
  # Reads apps/ai/uv.lock, so it needs no Python setup.
  check-ai-no-provider-sdk:
    name: no provider SDK in apps/ai
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: make check-ai-no-provider-sdk
        run: make check-ai-no-provider-sdk

  # K2-2/K2-3/FR-008: the ai service's environment must carry no database
  # credential and no provider credential in either compose file. Not gated
  # on the `python` filter alone — a change confined to docker-compose.yml
  # or docker-compose.prod.yml must still run this.
  check-ai-service-env:
    name: ai service env has no DB or provider credential
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: make check-ai-env
        run: make check-ai-env

  build-image-api:
    name: build image (api)
    needs: changes
    # Filter `go`. apps/api/Dockerfile COPYs only apps/api/go.mod, apps/api/go.sum
    # and apps/api/. — every one covered by the `go` filter's 'apps/api/**'
    # entry. The `go` anchor also carries 'gateway/**', so a gateway-only change
    # rebuilds this image unnecessarily. That is the right way round: a false
    # run costs two minutes, a false skip lets a broken image merge.
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # push: false and load: false — this gate proves the image BUILDS. It
      # publishes nothing, needs no registry credential, and skips the export
      # to the runner's docker daemon, which nothing here consumes.
      #
      # The gha cache is content-addressed per layer, so a changed COPY input
      # invalidates from that layer down and cannot serve a stale success.
      # Scoped per image so the two do not evict each other.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-image-dashboard:
    name: build image (dashboard)
    needs: changes
    # Filter `web`. apps/dashboard/Dockerfile COPYs pnpm-workspace.yaml,
    # package.json, pnpm-lock.yaml, tsconfig.base.json, packages/shared and
    # apps/dashboard — every one already listed in the `web` filter.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

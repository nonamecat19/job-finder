name: API CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Which parts of the tree a pull request touched. Every other job gates on
  # this so a specs-only or docs-only change does not spend ~20 runner-minutes
  # rebuilding Go and Node.
  #
  # Deliberately NOT a top-level `on: paths:` filter: a workflow skipped that
  # way never reports its checks at all, so once the Phase 2 ruleset in
  # specs/023-workflow-quality-gates/contracts/required-checks.md is applied
  # every required check would sit at "Expected" forever and block the merge.
  # A job skipped by `if:` reports as skipped, which GitHub counts as passing.
  #
  # Outputs fold in the event check, so pushes to master (and manual re-runs)
  # always run the full set: dorny/paths-filter diffs against the previous
  # commit on push, which is a weaker signal than a PR's merge-base.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      sqlc: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sqlc == 'true' }}
      tygo: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tygo == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Touching CI itself, the check scripts or the Makefile can change
            # any verdict, so those force the whole set to run.
            ci: &ci
              - '.github/workflows/**'
              - 'Makefile'
            go: &go
              - *ci
              - 'apps/api/**'
              - 'scripts/sqlc-check.sh'
              - 'scripts/tygo-check.sh'
            sqlc:
              - *ci
              - 'scripts/sqlc-check.sh'
              - 'apps/api/sqlc.yaml'
              - 'apps/api/.sqlc-version'
              - 'apps/api/internal/db/migrations/**'
              - 'apps/api/internal/db/queries/**'
              - 'apps/api/internal/db/sqlcgen/**'
            # tygo reads Go DTOs and writes packages/shared/src/generated.ts,
            # so it straddles both sides and watches both.
            tygo:
              - *go
              - 'packages/shared/src/generated.ts'
            web:
              - *ci
              - 'apps/dashboard/**'
              - 'packages/shared/**'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  sqlc-drift:
    name: sqlc generate is up to date
    needs: changes
    if: needs.changes.outputs.sqlc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned sqlc version
        id: sqlc
        run: echo "version=$(tr -d '[:space:]' < apps/api/.sqlc-version)" >> "$GITHUB_OUTPUT"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      - name: Check generated code matches migrations and queries
        run: ./scripts/sqlc-check.sh

  tygo-drift:
    name: tygo generate is up to date
    needs: changes
    if: needs.changes.outputs.tygo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned tygo version
        id: tygo
        run: echo "version=$(tr -d '[:space:]' < apps/api/.tygo-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v${{ steps.tygo.outputs.version }}

      - name: Check generated TypeScript matches Go DTOs
        run: ./scripts/tygo-check.sh

  lint-go:
    name: lint (go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Read pinned golangci-lint version
        id: gl
        run: echo "version=$(tr -d '[:space:]' < apps/api/.golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ steps.gl.outputs.version }}
          working-directory: apps/api

  go-vet:
    name: go vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: go vet ./...
        working-directory: apps/api
        run: go vet ./...

  go-test:
    name: go test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: go test ./...
        working-directory: apps/api
        run: go test ./...

  integration-test:
    name: integration test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      # pgvector, not stock postgres: integration fixtures build vector(768)
      # values (internal/matching/integration_test.go), which stock postgres
      # cannot even create the schema for.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobfinder_test
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://jobfinder:postgres@localhost:5432/jobfinder_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      # Two-step run, ordering matters: only internal/db's suite calls
      # Migrate() (internal/db/integration_test.go:31); the other
      # integration-tagged packages assume the schema already exists, and
      # `go test ./...` runs packages in parallel, so a single combined
      # invocation can start a dependent package before migration finishes.
      # The advisory lock in internal/dbtest/lock.go serialises TRUNCATE
      # between suites, not schema creation.
      - name: Migrate test database
        working-directory: apps/api
        run: go test -tags integration ./internal/db/... -run TestMigrate

      - name: go test -tags integration ./...
        working-directory: apps/api
        run: go test -tags integration ./...

  frontend-test:
    name: frontend test (vitest)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Run dashboard tests
        run: pnpm --filter @job-finder/dashboard test

  frontend-typecheck:
    name: frontend typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Typecheck
        run: pnpm typecheck

  lint-web:
    name: lint (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: make lint-web
        run: make lint-web

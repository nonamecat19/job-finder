name: API CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  sqlc-drift:
    name: sqlc generate is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned sqlc version
        id: sqlc
        run: echo "version=$(tr -d '[:space:]' < apps/api/.sqlc-version)" >> "$GITHUB_OUTPUT"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      - name: Check generated code matches migrations and queries
        run: ./scripts/sqlc-check.sh

  tygo-drift:
    name: tygo generate is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned tygo version
        id: tygo
        run: echo "version=$(tr -d '[:space:]' < apps/api/.tygo-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v${{ steps.tygo.outputs.version }}

      - name: Check generated TypeScript matches Go DTOs
        run: ./scripts/tygo-check.sh

  lint-go:
    name: lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Read pinned golangci-lint version
        id: gl
        run: echo "version=$(tr -d '[:space:]' < apps/api/.golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ steps.gl.outputs.version }}
          working-directory: apps/api

  go-vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: go vet ./...
        working-directory: apps/api
        run: go vet ./...

  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: go test ./...
        working-directory: apps/api
        run: go test ./...

  frontend-test:
    name: frontend test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Run dashboard tests
        run: pnpm --filter @job-finder/dashboard test

  frontend-typecheck:
    name: frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: Typecheck
        run: pnpm typecheck

  lint-web:
    name: lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      - name: make lint-web
        run: make lint-web

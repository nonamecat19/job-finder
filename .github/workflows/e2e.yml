name: E2E

# FR-019: at least daily, and triggerable on demand. Given its own workflow
# file rather than folded into api-ci.yml's `on:` block, so the schedule and
# manual dispatch triggers don't also re-run every existing job in that
# workflow (sqlc-drift, tygo-drift, go-vet, ...) which contracts/
# required-checks.md's trigger column lists as "PR, push master" only.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Mirrors api-ci.yml's `changes` job. Duplicated rather than shared because a
  # reusable workflow cannot return outputs to a caller's `if:` without an extra
  # runner hop, and this job is ~15s.
  #
  # Only pull_request is filtered — the nightly schedule, workflow_dispatch and
  # pushes to master must always run the suite (FR-019 requires "at least
  # daily", which a filtered-out nightly would silently violate).
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Wider than api-ci.yml's `web` filter: the specs mock the API with
          # page.route, but they still exercise the dashboard against types
          # generated from the Go DTOs, so any apps/api change counts.
          #
          # This file and the Makefile are deliberately absent, matching
          # api-ci.yml: a docs- or workflow-only pull request skips the suite,
          # and the nightly schedule plus pushes to master run it unfiltered.
          filters: |
            e2e:
              - 'apps/api/**'
              - 'apps/dashboard/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'

  e2e:
    name: e2e (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @job-finder/shared build

      # No database, Redis or Go backend needed: feed.spec.ts and
      # sources.spec.ts mock every API call via page.route, and
      # navigation.spec.ts only asserts headings/URLs. playwright.config.ts
      # already starts the dev server via `webServer` with
      # reuseExistingServer: !process.env.CI.
      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: apps/dashboard
        run: pnpm exec playwright test

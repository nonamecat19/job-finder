services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-jobfinder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-consumer-timeout.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq-init:
    image: curlimages/curl:8.11.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-jobfinder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_AI_USER: ${RABBITMQ_AI_USER:-ai_service}
      RABBITMQ_AI_PASS: ${RABBITMQ_AI_PASS:?set RABBITMQ_AI_PASS in .env}
    volumes:
      - ./docker/rabbitmq/init-ai-user.sh:/init-ai-user.sh:ro
    entrypoint: ["/bin/sh", "/init-ai-user.sh"]

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    environment:
      GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_AI_USER:-ai_service}:${RABBITMQ_AI_PASS}@rabbitmq:5672/
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      litellm:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobfinder:${DB_PASSWORD}@postgres:5432/jobfinder
      REDIS_URL: redis://redis:6379
      DOCUMENTS_DIR: /data/documents
      PORT: ${PORT:-3000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_USE_SSL: "false"
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}

      GATEWAY_URL: ${GATEWAY_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      EMBED_DIMS: ${EMBED_DIMS:-}
      LLM_MAX_IDLE_CONNS_PER_HOST: ${LLM_MAX_IDLE_CONNS_PER_HOST:-}

      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-jobfinder}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_CAPABILITY_ROUTING: ${AI_CAPABILITY_ROUTING:-}

      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOBLEADS_EMAIL: ${JOBLEADS_EMAIL:-}
      JOBLEADS_PASSWORD: ${JOBLEADS_PASSWORD:-}
      DJINNI_EMAIL: ${DJINNI_EMAIL:-}
      DJINNI_PASSWORD: ${DJINNI_PASSWORD:-}
      DJINNI_DETAIL_DELAY_MS: ${DJINNI_DETAIL_DELAY_MS:-}
      DJINNI_RATE_OVERRIDE_RPS: ${DJINNI_RATE_OVERRIDE_RPS:-}
      WORKUA_DETAIL_DELAY_MS: ${WORKUA_DETAIL_DELAY_MS:-}
      LINKEDIN_SCRAPE_ENABLED: ${LINKEDIN_SCRAPE_ENABLED:-}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      JOBSPY_URL: ${JOBSPY_URL:-}
      BROWSER_IDENTITY_VERSION: ${BROWSER_IDENTITY_VERSION:-}

      MATCH_SIMILARITY_THRESHOLD: ${MATCH_SIMILARITY_THRESHOLD:-}
      MATCH_NOTIFY_SCORE_THRESHOLD: ${MATCH_NOTIFY_SCORE_THRESHOLD:-}
      MATCH_NOTIFY_RATE_LIMIT: ${MATCH_NOTIFY_RATE_LIMIT:-}
      KEYWORD_REPHRASE_CACHE_TTL_SEC: ${KEYWORD_REPHRASE_CACHE_TTL_SEC:-}
      RESUME_GROUNDING_LEVEL: ${RESUME_GROUNDING_LEVEL:-}
      RESUME_MASTER_PATH: ${RESUME_MASTER_PATH:-}
      LEVELS_FYI_CSV: ${LEVELS_FYI_CSV:-}
      SALARY_FLOOR_USD: ${SALARY_FLOOR_USD:-}

      AI_CONCURRENCY_CLOUD: ${AI_CONCURRENCY_CLOUD:-}
      AI_TASK_TIMEOUT_MATCH: ${AI_TASK_TIMEOUT_MATCH:-}
      AI_TASK_TIMEOUT_GENERATE: ${AI_TASK_TIMEOUT_GENERATE:-}
      AI_TASK_TIMEOUT_SALARY: ${AI_TASK_TIMEOUT_SALARY:-}
      AI_TASK_TIMEOUT_GHOST: ${AI_TASK_TIMEOUT_GHOST:-}
      AI_TASK_TIMEOUT_ENRICH: ${AI_TASK_TIMEOUT_ENRICH:-}
      AI_TASK_TIMEOUT_INGEST: ${AI_TASK_TIMEOUT_INGEST:-}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-}
      INGEST_PERSIST_CHUNK_SIZE: ${INGEST_PERSIST_CHUNK_SIZE:-}
      ENRICH_CONCURRENCY: ${ENRICH_CONCURRENCY:-}
      COOLING_OFF_THRESHOLD: ${COOLING_OFF_THRESHOLD:-}
      COOLING_OFF_BASE_DURATION: ${COOLING_OFF_BASE_DURATION:-}
      CHEAP_RUNG_RETEST_INTERVAL: ${CHEAP_RUNG_RETEST_INTERVAL:-}
      ACTIVITY_HEARTBEAT_INTERVAL: ${ACTIVITY_HEARTBEAT_INTERVAL:-}
      ACTIVITY_STALE_AFTER: ${ACTIVITY_STALE_AFTER:-}
      ACTIVITY_QUEUED_GRACE: ${ACTIVITY_QUEUED_GRACE:-}
      ACTIVITY_SWEEP_INTERVAL: ${ACTIVITY_SWEEP_INTERVAL:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-}
      DB_SERVER_MAX_CONNS: ${DB_SERVER_MAX_CONNS:-}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-}
      DB_ACQUIRE_TIMEOUT: ${DB_ACQUIRE_TIMEOUT:-}
      DB_INTERACTIVE_RESERVE: ${DB_INTERACTIVE_RESERVE:-}

      EVAL_PRUNE_COLLECTOR_URL: ${EVAL_PRUNE_COLLECTOR_URL:-}
      EVAL_PRUNE_PUBLIC_KEY: ${EVAL_PRUNE_PUBLIC_KEY:-}
      EVAL_PRUNE_SECRET_KEY: ${EVAL_PRUNE_SECRET_KEY:-}
      EVAL_PRUNE_RETENTION_DAYS: ${EVAL_PRUNE_RETENTION_DAYS:-}

      LANGFUSE_PAYLOAD_RETENTION_DAYS: ${LANGFUSE_PAYLOAD_RETENTION_DAYS:-}
      RETENTION_CLICKHOUSE_URL: ${RETENTION_CLICKHOUSE_URL:-}
      RETENTION_CLICKHOUSE_USER: ${RETENTION_CLICKHOUSE_USER:-}
      RETENTION_CLICKHOUSE_PASSWORD: ${RETENTION_CLICKHOUSE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - documents:/data/documents
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on: [api]
    ports:
      - "8080:80"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [scraping-extras]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *200* ]]',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      exit 0;
      "

volumes:
  pgdata: {}
  documents: {}
  miniodata: {}
  rabbitmqdata: {}

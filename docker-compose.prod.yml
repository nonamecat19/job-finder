services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobfinder:${DB_PASSWORD}@postgres:5432/jobfinder
      REDIS_URL: redis://redis:6379
#      OLLAMA_URL: http://localhost:11434
      JOBSPY_URL: http://jobspy-sidecar:8000
      DOCUMENTS_DIR: /data/documents
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - documents:/data/documents
    ports:
      - "3000:3000" # dev convenience; dashboard nginx proxies /api in normal use

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on: [api]
    ports:
      - "8080:80"

  jobspy-sidecar:
    build: apps/jobspy-sidecar
    # internal only, no host port

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [scraping-extras]

  # MinIO S3-compatible object storage for generated resume/cover-letter files.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # One-shot init that creates the documents bucket once MinIO is reachable.
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      exit 0;
      "

volumes:
  pgdata: {}
  documents: {}
  miniodata: {}

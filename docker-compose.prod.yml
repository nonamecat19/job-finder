# Production compose.
#
# --- The gateway is required here now (044-litellm-only-routing, Constitution
# Principle V 2.0.0). There is no local-first path left: every AI request,
# prod included, goes through the self-hosted `litellm` proxy to a hosted
# provider. Prod and dev route through the same artifact — same image, same
# read-only gateway/config.yaml mount, same healthcheck, no depends_on
# (contracts/configuration.md K5-1).
#
# LLM observability (036) still has no collector here: `litellm`'s success/
# failure callbacks would have somewhere to attach now that the gateway
# exists in prod, but wiring the Langfuse service group here is a separate,
# explicit trade (real credentials, another stateful service) that this
# feature does not make. The collector service group stays dev-only in
# docker-compose.yml.
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      # litellm main-stable image has no curl/wget; Python is the only HTTP
      # client available.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # NO `env_file: .env` (036 FR-007 / Constitution Principle V).
    #
    # This service used to ingest the whole .env, which handed the application
    # container every provider credential — OPENROUTER_API_KEY, OPENAI_API_KEY.
    # The constitution requires those to stay in the gateway container and be
    # unreadable through the application, so the wholesale import was a
    # standing violation independent of any feature.
    #
    # The list below is explicit and enumerates exactly what internal/config
    # reads. It is verbose on purpose: an allowlist that must be edited to add
    # a variable is the only version of this that stays correct. When adding a
    # config field, add it here too — and never add a provider API key.
    environment:
      # --- infrastructure ---
      DATABASE_URL: postgresql://jobfinder:${DB_PASSWORD}@postgres:5432/jobfinder
      REDIS_URL: redis://redis:6379
      DOCUMENTS_DIR: /data/documents
      PORT: ${PORT:-3000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_USE_SSL: "false"
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}

      # --- LLM access ---
      # GATEWAY_URL and LITELLM_MASTER_KEY are required (contracts/
      # configuration.md K1) — this is the application's only inference path.
      # LITELLM_MASTER_KEY authenticates the app TO the gateway; it is not a
      # provider credential and is the one secret the application container
      # is permitted. No provider API key (OPENROUTER/OPENAI) is ever granted
      # here — those live only in the litellm service's environment above.
      GATEWAY_URL: ${GATEWAY_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      EMBED_DIMS: ${EMBED_DIMS:-}
      LLM_MAX_IDLE_CONNS_PER_HOST: ${LLM_MAX_IDLE_CONNS_PER_HOST:-}

      # --- job sources (their own credentials, not inference credentials) ---
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOBLEADS_EMAIL: ${JOBLEADS_EMAIL:-}
      JOBLEADS_PASSWORD: ${JOBLEADS_PASSWORD:-}
      DJINNI_EMAIL: ${DJINNI_EMAIL:-}
      DJINNI_PASSWORD: ${DJINNI_PASSWORD:-}
      DJINNI_DETAIL_DELAY_MS: ${DJINNI_DETAIL_DELAY_MS:-}
      DJINNI_RATE_OVERRIDE_RPS: ${DJINNI_RATE_OVERRIDE_RPS:-}
      WORKUA_DETAIL_DELAY_MS: ${WORKUA_DETAIL_DELAY_MS:-}
      LINKEDIN_SCRAPE_ENABLED: ${LINKEDIN_SCRAPE_ENABLED:-}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      JOBSPY_URL: ${JOBSPY_URL:-}
      BROWSER_IDENTITY_VERSION: ${BROWSER_IDENTITY_VERSION:-}

      # --- matching / generation tuning ---
      MATCH_SIMILARITY_THRESHOLD: ${MATCH_SIMILARITY_THRESHOLD:-}
      MATCH_NOTIFY_SCORE_THRESHOLD: ${MATCH_NOTIFY_SCORE_THRESHOLD:-}
      MATCH_NOTIFY_RATE_LIMIT: ${MATCH_NOTIFY_RATE_LIMIT:-}
      KEYWORD_REPHRASE_CACHE_TTL_SEC: ${KEYWORD_REPHRASE_CACHE_TTL_SEC:-}
      RESUME_GROUNDING_LEVEL: ${RESUME_GROUNDING_LEVEL:-}
      RESUME_MASTER_PATH: ${RESUME_MASTER_PATH:-}
      LEVELS_FYI_CSV: ${LEVELS_FYI_CSV:-}
      SALARY_FLOOR_USD: ${SALARY_FLOOR_USD:-}

      # --- concurrency, timeouts, pool ---
      AI_CONCURRENCY_CLOUD: ${AI_CONCURRENCY_CLOUD:-}
      AI_TASK_TIMEOUT_MATCH: ${AI_TASK_TIMEOUT_MATCH:-}
      AI_TASK_TIMEOUT_GENERATE: ${AI_TASK_TIMEOUT_GENERATE:-}
      AI_TASK_TIMEOUT_SALARY: ${AI_TASK_TIMEOUT_SALARY:-}
      AI_TASK_TIMEOUT_GHOST: ${AI_TASK_TIMEOUT_GHOST:-}
      AI_TASK_TIMEOUT_ENRICH: ${AI_TASK_TIMEOUT_ENRICH:-}
      AI_TASK_TIMEOUT_INGEST: ${AI_TASK_TIMEOUT_INGEST:-}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-}
      INGEST_PERSIST_CHUNK_SIZE: ${INGEST_PERSIST_CHUNK_SIZE:-}
      ENRICH_CONCURRENCY: ${ENRICH_CONCURRENCY:-}
      COOLING_OFF_THRESHOLD: ${COOLING_OFF_THRESHOLD:-}
      COOLING_OFF_BASE_DURATION: ${COOLING_OFF_BASE_DURATION:-}
      CHEAP_RUNG_RETEST_INTERVAL: ${CHEAP_RUNG_RETEST_INTERVAL:-}
      ACTIVITY_HEARTBEAT_INTERVAL: ${ACTIVITY_HEARTBEAT_INTERVAL:-}
      ACTIVITY_STALE_AFTER: ${ACTIVITY_STALE_AFTER:-}
      ACTIVITY_QUEUED_GRACE: ${ACTIVITY_QUEUED_GRACE:-}
      ACTIVITY_SWEEP_INTERVAL: ${ACTIVITY_SWEEP_INTERVAL:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-}
      DB_SERVER_MAX_CONNS: ${DB_SERVER_MAX_CONNS:-}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-}
      DB_ACQUIRE_TIMEOUT: ${DB_ACQUIRE_TIMEOUT:-}
      DB_INTERACTIVE_RESERVE: ${DB_INTERACTIVE_RESERVE:-}

      # --- observability retention (036 FR-008) ---
      # Not LANGFUSE_* — see the note on those names in .env.example. This is a
      # collector API key so the platform can delete its own records, never a
      # provider credential, and it is inert unless a collector is configured.
      EVAL_PRUNE_COLLECTOR_URL: ${EVAL_PRUNE_COLLECTOR_URL:-}
      EVAL_PRUNE_PUBLIC_KEY: ${EVAL_PRUNE_PUBLIC_KEY:-}
      EVAL_PRUNE_SECRET_KEY: ${EVAL_PRUNE_SECRET_KEY:-}
      EVAL_PRUNE_RETENTION_DAYS: ${EVAL_PRUNE_RETENTION_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - documents:/data/documents
    ports:
      - "3000:3000" # dev convenience; dashboard nginx proxies /api in normal use

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on: [api]
    ports:
      - "8080:80"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [scraping-extras]

  # MinIO S3-compatible object storage for generated resume/cover-letter files.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # minio's image ships no curl/wget/mc; /bin/sh is bash, so probe
      # /minio/health/live with bash's /dev/tcp pseudo-device instead.
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *200* ]]',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init that creates the documents bucket once MinIO is reachable.
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      exit 0;
      "

volumes:
  pgdata: {}
  documents: {}
  miniodata: {}
